esphome:
  name: electra-ac
  friendly_name: Electra AC

esp32:
  board: esp32dev
  framework:
    type: arduino

# Expose state sync action to Home Assistant
api:
  actions:
    - action: sync_electra_state
      then:
        - electra.sync_state: electra_ac

ota:
  - platform: esphome

wifi:
  ssid: "Your_WiFi_SSID"
  password: "Your_WiFi_Password"

logger:

external_components:
  - source:
      type: git
      url: https://github.com/omerstr/ElectraEspHomeIR
      ref: main

# Optional: external ambient temperature sensor (e.g. from Home Assistant or local sensor)
sensor:
  - platform: homeassistant
    id: room_temperature
    entity_id: sensor.living_room_temperature

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%
  id: ir_transmitter

remote_receiver:
  pin:
    number: GPIO5
    inverted: true
    mode:
      input: true
      pullup: true
  tolerance: 50%
  id: ir_receiver

climate:
  - platform: electra
    name: "Living Room AC"
    id: electra_ac
    transmitter_id: ir_transmitter
    receiver_id: ir_receiver
    supports_off_command: true
    sensor: room_temperature

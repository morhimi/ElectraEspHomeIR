name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install esphome

      - name: Validate example configuration
        run: |
          # Test example.yaml using local external_components path
          sed -i 's|url: https://github.com/omerstr/ElectraEspHomeIR|path: components|g' example.yaml
          sed -i '/type: git/d' example.yaml
          sed -i '/ref: main/d' example.yaml
          esphome config example.yaml
